        const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        defs.innerHTML = `
          <radialGradient id="gradTileActive_${sfx}" cx="${isLeft ? '20%' : '80%'}" cy="80%" r="85%">
            <stop offset="0%" stop-color="#ffd573" stop-opacity="0.36"/>
            <stop offset="45%" stop-color="#deb056" stop-opacity="0.24"/>
            <stop offset="100%" stop-color="#2a2010" stop-opacity="0.55"/>
          </radialGradient>
          <radialGradient id="gradTileIdle_${sfx}" cx="${isLeft ? '20%' : '80%'}" cy="80%" r="85%">
            <stop offset="0%" stop-color="#1e1a16" stop-opacity="0.80"/>
            <stop offset="60%" stop-color="#12100e" stop-opacity="0.88"/>
            <stop offset="100%" stop-color="#070605" stop-opacity="0.94"/>
          </radialGradient>
          <linearGradient id="gradRimActive_${sfx}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff0c7" stop-opacity="0.95"/>
            <stop offset="50%" stop-color="#deb056" stop-opacity="0.75"/>
            <stop offset="100%" stop-color="#805d1e" stop-opacity="0.35"/>
          </linearGradient>
          <linearGradient id="gradRimIdle_${sfx}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(222, 176, 86, 0.32)"/>
            <stop offset="100%" stop-color="rgba(222, 176, 86, 0.08)"/>
          </linearGradient>
        `;
        svgEl.appendChild(defs);

        // 2. Concentric Guideline Circles (Static, flush with corner radius)
        const staticGrid = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        staticGrid.setAttribute('opacity', '0.28');
        [80, 151, 223, 295].forEach(r => {
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', cx);
          circle.setAttribute('cy', cy);
          circle.setAttribute('r', r);
          circle.setAttribute('stroke', 'rgba(222, 176, 86, 0.22)');
          circle.setAttribute('stroke-width', '1');
          circle.setAttribute('stroke-dasharray', '2 4');
          circle.setAttribute('fill', 'none');
          staticGrid.appendChild(circle);
        });
        svgEl.appendChild(staticGrid);

        // 3. Persistent Rotating Group for all 12 spokes (Full 360-degree rotor)
        const rotorG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        rotorG.setAttribute('id', `rotorGroup_${sfx}`);
        if (isLeft) rotorGroupLeft = rotorG;
        else rotorGroupRight = rotorG;

        const TOTAL_COLUMNS = QUICK_COLUMNS.length; // 6
        const SPOKE_STEP = 30; // 30 deg per spoke
        const TOTAL_SPOKES = 12; // 12 spokes = 360 degrees full continuous wrap

        for (let s = 0; s < TOTAL_SPOKES; s++) {
          const colIndex = s % TOTAL_COLUMNS;
          const columnTiles = QUICK_COLUMNS[colIndex];
          const ang = s * SPOKE_STEP;
          const a1 = ang + 2;
          const a2 = ang + 28;

          // Radial spoke divider line
          const spokeLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          const ptStart = polarPt(isLeft, 80, a1 - 1);
          const ptEnd = polarPt(isLeft, 294, a1 - 1);
          spokeLine.setAttribute('x1', ptStart.x.toFixed(1));
          spokeLine.setAttribute('y1', ptStart.y.toFixed(1));
          spokeLine.setAttribute('x2', ptEnd.x.toFixed(1));
          spokeLine.setAttribute('y2', ptEnd.y.toFixed(1));
          spokeLine.setAttribute('stroke', 'rgba(222, 176, 86, 0.20)');
          spokeLine.setAttribute('stroke-width', '0.8');
          spokeLine.setAttribute('stroke-dasharray', '2 4');
          rotorG.appendChild(spokeLine);

          // 3 Tile blocks per spoke
          columnTiles.forEach(tile => {
            const ring = POLAR_RINGS[tile.ring];
            const d = makePolarPath(isLeft, ring.r1, ring.r2, a1, a2);
            const rMid = (ring.r1 + ring.r2) / 2;
            const aMid = (a1 + a2) / 2;
            const center = polarPt(isLeft, rMid, aMid);

            const tileG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            tileG.setAttribute('class', 'polar-tile-block' + (tile.active ? ' is-active' : ''));
            tileG.setAttribute('data-tile-id', tile.id);

            // Path
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('class', 'tile-sector-path');
            path.setAttribute('d', d);
            tileG.appendChild(path);

            // Vector Glyph
            const glyphG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            glyphG.setAttribute('transform', `translate(${(center.x - 10).toFixed(1)}, ${(center.y - 18).toFixed(1)})`);
            glyphG.setAttribute('class', 'tile-glyph');
            glyphG.setAttribute('pointer-events', 'none');
            const rawSvg = SVG_ICONS[tile.glyph] || SVG_ICONS.wifi;
            glyphG.innerHTML = rawSvg.replace('<svg', '<svg width="20" height="20" class="tile-glyph-svg"');
            tileG.appendChild(glyphG);

            // Label
            const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            label.setAttribute('class', 'tile-label');
            label.setAttribute('x', center.x.toFixed(1));
            label.setAttribute('y', (center.y + 5).toFixed(1));
            label.textContent = tile.name;
            tileG.appendChild(label);

            // Active LED
            const led = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            led.setAttribute('class', 'tile-active-led');
            led.setAttribute('cx', (center.x - 22).toFixed(1));
            led.setAttribute('cy', (center.y + 14.5).toFixed(1));
            led.setAttribute('r', '2');
            led.setAttribute('fill', '#deb056');
            led.style.display = tile.active ? 'block' : 'none';
            tileG.appendChild(led);

            // Status Subtitle
            const status = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            status.setAttribute('class', 'tile-status');
            status.setAttribute('x', center.x.toFixed(1));
            status.setAttribute('y', (center.y + 16).toFixed(1));
            status.textContent = tile.active ? tile.status : 'Off';
            tileG.appendChild(status);

            // Clean, Zero-Flicker Tile Click
            tileG.onclick = (e) => {
              if (hasDragged) return;
              e.stopPropagation();
              triggerHaptic(18);
              tile.active = !tile.active;

              // Synchronize state across all matching tile instances in DOM
              document.querySelectorAll(`[data-tile-id="${tile.id}"]`).forEach(el => {
                el.classList.toggle('is-active', tile.active);
                const l = el.querySelector('.tile-active-led');
                if (l) l.style.display = tile.active ? 'block' : 'none';
                const s = el.querySelector('.tile-status');
                if (s) s.textContent = tile.active ? tile.status : 'Off';
              });

              const tileIconSvg = SVG_ICONS[tile.glyph] || SVG_ICONS.wifi;
              triggerIsland(tile.name, tile.active ? tile.status : 'Disabled', tileIconSvg);
            };

            rotorG.appendChild(tileG);
          });
        }
        svgEl.appendChild(rotorG);

        // 4. Standalone Corner NOTIF Button (Static, outside rotor)
        const notifCx = isLeft ? 34 : (330 - 34);
        const notifCy = 296;
        const notifR = 23;

        const hubBtn = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        hubBtn.setAttribute('class', 'corner-round-notif-btn');
        hubBtn.setAttribute('style', 'cursor: pointer;');

        function handleHubPress(e) {
          if (e) { e.stopPropagation(); if (e.preventDefault) e.preventDefault(); }
          notifOpenedTimestamp = Date.now();
          closeArcLeft();
          closeArcRight();
          triggerHaptic(20);
          triggerIsland('Notifications', 'Center Opened', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>');
          openNotifModal();
        }

        hubBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
        hubBtn.addEventListener('pointerup', handleHubPress);
        hubBtn.addEventListener('click', handleHubPress);

        const halo = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        halo.setAttribute('cx', notifCx);
        halo.setAttribute('cy', notifCy);
        halo.setAttribute('r', notifR + 4);
        halo.setAttribute('fill', 'none');
        halo.setAttribute('stroke', 'rgba(222, 176, 86, 0.22)');
        halo.setAttribute('stroke-width', '1');
        halo.setAttribute('stroke-dasharray', '2.5 3');
        hubBtn.appendChild(halo);

        const hubCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        hubCircle.setAttribute('cx', notifCx);
        hubCircle.setAttribute('cy', notifCy);
        hubCircle.setAttribute('r', notifR);
        hubCircle.setAttribute('fill', 'rgba(18, 15, 12, 0.90)');
        hubCircle.setAttribute('stroke', 'rgba(222, 176, 86, 0.38)');
        hubCircle.setAttribute('stroke-width', '1.2');
        hubBtn.appendChild(hubCircle);

        const hubIcon = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        hubIcon.setAttribute('transform', `translate(${notifCx - 8}, ${notifCy - 11})`);
        hubIcon.setAttribute('pointer-events', 'none');
        hubIcon.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#deb056" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`;
        hubBtn.appendChild(hubIcon);

        const hubText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        hubText.setAttribute('x', notifCx);
        hubText.setAttribute('y', notifCy + 13);
        hubText.setAttribute('font-size', '6.5');
        hubText.setAttribute('font-weight', '700');
        hubText.setAttribute('fill', 'rgba(255,255,255,0.85)');
        hubText.setAttribute('text-anchor', 'middle');
        hubText.textContent = 'NOTIFS';
        hubBtn.appendChild(hubText);

        svgEl.appendChild(hubBtn);
        updateRotorTransform(isLeft);
      }

      function renderPolarGrid(svgEl, isLeft) {
        updateRotorTransform(isLeft);
      }

      buildRotaryDial(svgArcLeft, true);
      buildRotaryDial(svgArcRight, false);

      renderPolarGrid(svgArcLeft, true);
      renderPolarGrid(svgArcRight, false);

      function renderNotifications() {
        notifList.innerHTML = '';
        const visibleNotifs = BUTTEROS_NOTIFS.filter(n => !n.blocked);
        const unblockedCount = visibleNotifs.length;

        if (unblockedCount === 0) {
          notifList.innerHTML = `
            <div class="notif-empty-state">
              <div class="empty-icon">✓</div>
              <div class="empty-title">All Caught Up</div>
              <div class="empty-sub">ButterOS Notification Center is clear</div>
            </div>
          `;
          notifCountBadge.textContent = '0';
          return;
        }

        visibleNotifs.forEach(notif => {
          const card = document.createElement('div');
          card.className = 'notif-card';
          card.setAttribute('data-id', notif.id);

          let iconSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>';
          if (notif.app === 'Terminal') {
            iconSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#deb056" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>';
          } else if (notif.app === 'Messages') {
            iconSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f8df9e" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
          } else if (notif.app === 'System') {
            iconSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#deb056" stroke-width="2.2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>';
          } else if (notif.app === 'Git') {
            iconSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f8df9e" stroke-width="2.2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" y1="9" x2="6" y2="21"/></svg>';
          }

          card.innerHTML = `
            <div class="notif-card-top">
              <div class="notif-app-info">
                <div class="notif-app-icon ${notif.iconClass}">${iconSvg}</div>
                <div class="notif-app-name">${notif.app}</div>
              </div>
              <div class="notif-time">${notif.time}</div>
            </div>
            <div class="notif-card-title">${notif.title}</div>
            <div class="notif-card-body">${notif.body}</div>
            <div class="notif-actions">
              <button class="btn-notif btn-notif-action">${notif.actionLabel}</button>
              <button class="btn-notif btn-notif-block" data-id="${notif.id}">Dismiss</button>
            </div>
          `;

          // Action button (e.g. Review, Watch, Update All, Open Folder)
          const actBtn = card.querySelector('.btn-notif-action');
          actBtn.onclick = (e) => {
            e.stopPropagation();
            actBtn.style.transform = 'scale(0.9)';
            setTimeout(() => { actBtn.style.transform = ''; }, 140);
            triggerIsland(notif.app, `${notif.actionLabel}ing...`, iconSvg);
            setTimeout(() => {
              notif.blocked = true;
              card.classList.add('is-dismissing');
              setTimeout(renderNotifications, 240);
            }, 600);
          };

          // Dismiss button
          const blockBtn = card.querySelector('.btn-notif-block');
          blockBtn.onclick = (e) => {
            e.stopPropagation();
            blockBtn.style.transform = 'scale(0.9)';
            setTimeout(() => { blockBtn.style.transform = ''; }, 140);
            notif.blocked = true;
            card.classList.add('is-dismissing');
            setTimeout(() => {
              renderNotifications();
              renderSpatialDeck();
              renderPolarGrid(svgArcLeft, true);
              renderPolarGrid(svgArcRight, false);
              triggerIsland('Notification', `${notif.app} dismissed`);
            }, 240);
          };

          // Swipe-to-dismiss gesture on card
          attachCardSwipe(card, notif);

          notifList.appendChild(card);
        });

        notifCountBadge.textContent = unblockedCount;
      }

      function attachCardSwipe(card, notif) {
        let cardStartX = 0;
        let cardStartY = 0;
        let cardIsSwiping = false;
        let currentCardX = 0;

        card.addEventListener('pointerdown', (e) => {
          if (e.target.closest('button')) return;
          cardStartX = e.clientX;
          cardStartY = e.clientY;
          cardIsSwiping = false;
          currentCardX = 0;
          card.style.transition = 'none';

          function onCardMove(ev) {
            const dx = ev.clientX - cardStartX;
            const dy = ev.clientY - cardStartY;

            if (!cardIsSwiping) {
              if (Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)) {
                cardIsSwiping = true;
                if (card.setPointerCapture) {
                  try { card.setPointerCapture(ev.pointerId); } catch(err) {}
                }
              } else if (Math.abs(dy) > 10) {
                // User is scrolling the notification list vertically: release swipe listener to allow natural touch scrolling
                window.removeEventListener('pointermove', onCardMove);
                window.removeEventListener('pointerup', onCardUp);
                card.style.transition = '';
                card.style.transform = '';
                card.style.opacity = '';
                return;
              }
            }

            if (cardIsSwiping) {
              ev.preventDefault();
              currentCardX = dx;
              card.style.transform = `translateX(${dx}px) rotate(${dx * 0.035}deg)`;
              card.style.opacity = `${Math.max(0.12, 1 - Math.abs(dx) / 220)}`;
            }
          }

          function onCardUp(ev) {
            window.removeEventListener('pointermove', onCardMove);
            window.removeEventListener('pointerup', onCardUp);

            if (cardIsSwiping) {
              card.style.transition = 'transform 0.25s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.22s ease, max-height 0.25s ease, margin 0.25s ease, padding 0.25s ease';
              if (Math.abs(currentCardX) > 70) {
                const dir = currentCardX > 0 ? 1 : -1;
                card.style.transform = `translateX(${dir * 320}px)`;
                card.style.opacity = '0';
                card.classList.add('is-dismissing');
                setTimeout(() => {
                  notif.blocked = true;
                  renderNotifications();
                  renderSpatialDeck();
                  renderPolarGrid(svgArcLeft, true);
                  renderPolarGrid(svgArcRight, false);
                  triggerIsland('Notification', `${notif.app} dismissed`);
                }, 220);
              } else {
                card.style.transform = '';
                card.style.opacity = '';
              }
            }
          }

          window.addEventListener('pointermove', onCardMove);
          window.addEventListener('pointerup', onCardUp);
        });
      }

      renderNotifications();

      // Clear All Notifications button with Dynamic Island
      const btnClearAllNotifs = document.getElementById('btnClearAllNotifs');
      if (btnClearAllNotifs) {
        btnClearAllNotifs.onclick = (e) => {
          e.stopPropagation();
          const cards = notifList.querySelectorAll('.notif-card');
          if (cards.length === 0) return;
          cards.forEach((c, idx) => {
            setTimeout(() => {
              c.classList.add('is-dismissing');
            }, idx * 40);
          });
          setTimeout(() => {
            BUTTEROS_NOTIFS.forEach(n => n.blocked = true);
            renderNotifications();
            renderSpatialDeck();
            renderPolarGrid(svgArcLeft, true);
            renderPolarGrid(svgArcRight, false);
            triggerIsland('Notifications', 'All Cleared');
          }, cards.length * 40 + 200);
        };
      }

      let notifOpenedTimestamp = 0;

      function openNotifModal() {
        closeArcLeft();
        closeArcRight();
        notifOpenedTimestamp = Date.now();
        notifModal.classList.add('open');
        homeCanvas.classList.add('dimmed');
        notifModal.style.transition = 'transform 0.4s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.28s ease';
        notifModal.style.transform = 'translate3d(0, 0, 0)';
        notifModal.style.opacity = '1';
      }

      function closeNotifModal() {
        notifOpenedTimestamp = 0;
        notifModal.style.transition = 'transform 0.38s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.25s ease';
        notifModal.style.transform = 'translate3d(0, -100%, 0)';
        notifModal.style.opacity = '0';
        setTimeout(() => {
          if (!isDragging || (activeTarget !== 'top-notif-pull' && activeTarget !== 'notif-push-up')) {
            notifModal.classList.remove('open');
            notifModal.style.transition = '';
            notifModal.style.transform = '';
            notifModal.style.opacity = '';
            if (!arcLeft.classList.contains('open') && !arcRight.classList.contains('open') && !drawerOpen && !railsOpen) {
              homeCanvas.classList.remove('dimmed');
            }
          }
        }, 380);
      }

      function startNotifPushUp(e, customStartY = null) {
        isDragging = true;
        hasDragged = false;
        activeTarget = 'notif-push-up';
        startX = e.clientX;
        startY = customStartY !== null ? customStartY : e.clientY;
        currentDragX = 0;
        currentDragY = 0;
        notifModal.style.transition = 'none';
      }

      notifCloseBtn.onclick = (e) => {
        e.stopPropagation();
        closeNotifModal();
      };

      const btnOpenNotifsEl = document.getElementById('btnOpenNotifs');
      if (btnOpenNotifsEl) {
        btnOpenNotifsEl.onclick = (e) => {
          e.stopPropagation();
          if (notifModal.classList.contains('open')) {
            closeNotifModal();
          } else {
            openNotifModal();
          }
        };
      }

      const shadeBottomHandle = document.getElementById('shadeBottomHandle');
      if (shadeBottomHandle) {
        shadeBottomHandle.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          startNotifPushUp(e);
        });
        shadeBottomHandle.onclick = (e) => {
          e.stopPropagation();
          if (!hasDragged) closeNotifModal();
        };
      }

      // Status Bar Click & Drag -> Opens Notification Bar
      const statusBarEl = document.querySelector('.status-bar');
      if (statusBarEl) {
        statusBarEl.addEventListener('click', (e) => {
          if (!drawerOpen) {
            e.stopPropagation();
            if (notifModal.classList.contains('open')) {
              closeNotifModal();
            } else {
              openNotifModal();
            }
          }
        });
        statusBarEl.addEventListener('pointerdown', (e) => {
          if (!drawerOpen && !notifModal.classList.contains('open')) {
            isDragging = true;
            hasDragged = false;
            activeTarget = 'top-notif-pull';
            startX = e.clientX;
            startY = e.clientY;
            currentDragX = 0;
            currentDragY = 0;
            notifModal.style.transition = 'none';
            e.preventDefault();
          }
        });
      }

      // Notification Header Drag-Up
      const notifHeader = document.querySelector('.notif-dropdown-header');
      if (notifHeader) {
        notifHeader.addEventListener('pointerdown', (e) => {
          if (e.target.closest('button')) return;
          startNotifPushUp(e);
        });
      }

      // Notification Modal background drag
      notifModal.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button, .btn-notif, .notif-close-btn, .btn-clear-all, .notif-card')) return;
        startNotifPushUp(e);
      });

      // ====================================================
      // GESTURE & INTERACTION ENGINE
      // - Swipe UP from bottom: App drawer pops up from down, rails combine!
      // - Swipe OUTWARD on rails: Rails retract!
      // - Swipe INWARD from screen edges: Rails pop up!
      // - Swipe UP from corner: Quick settings unfolds!
      // - Revolving rotary dial on quick settings tiles!
      // - Pull DOWN from top status bar: Notification shade!
      // ====================================================
      let railsOpen = true;
      let isDragging = false;
      let hasDragged = false;
      let activeTarget = null;
      let startX = 0, startY = 0;
      let currentDragX = 0, currentDragY = 0;
      let peakDragY = 0;
      let baseLoopOffset = 0;
      let arcOpenedTimestamp = 0;
      let arcStartTheta = 0;
      let arcBaseRevolver = 0;
      let isRevolving = false;

      // 1) Corner Hitboxes (Swipe Up -> Quick Settings, accessible anytime including in App Drawer)
      cornerIndicatorLeft.addEventListener('pointerdown', (e) => {
        if (notifModal.classList.contains('open')) return;
        isDragging = true;
        hasDragged = false;
        activeTarget = 'corner-left';
        startX = e.clientX;
        startY = e.clientY;
        peakDragY = e.clientY;
        currentDragX = 0; currentDragY = 0;
        e.preventDefault();
      });

      cornerIndicatorRight.addEventListener('pointerdown', (e) => {
        if (notifModal.classList.contains('open')) return;
        isDragging = true;
        hasDragged = false;
        activeTarget = 'corner-right';
        startX = e.clientX;
        startY = e.clientY;
        peakDragY = e.clientY;
        currentDragX = 0; currentDragY = 0;
        e.preventDefault();
      });

      // 2) Left Rail Touch
      railLeft.addEventListener('pointerdown', (e) => {
        if (!railsOpen && !drawerOpen) return;
        const rect = screen.getBoundingClientRect();
        const touchY = e.clientY - rect.top;
        if (drawerOpen) {
          isDragging = true;
          hasDragged = false;
          activeTarget = touchY <= 70 ? 'drawer-top-handle' : 'drawer-left';
          startX = e.clientX; startY = e.clientY;
          currentDragX = 0; currentDragY = 0;
          railLeft.style.transition = 'none';
          railRight.style.transition = 'none';
          drawerTopHandle.style.transition = 'none';
          return;
        }
        initRailDrag(e, 'rail-left');

            const hitSlot = hitEl ? hitEl.closest('.app-icon-slot') : null;
            if (hitSlot) {
              const foundItem = conveyorIconElements.find(item => item.el === hitSlot);
              const appToLaunch = foundItem ? foundItem.app : (hitSlot.__app || null);
              if (appToLaunch) {
                executeNativeApp(appToLaunch);
                isDragging = false;
                activeTarget = null;
                return;
              }
            }
          }

          // Free-wheel momentum release on App Drawer grid
          if ((activeTarget === 'drawer-left' || activeTarget === 'drawer-right') && Math.abs(kineticScrollVel) > 0.12) {
            startKineticInertia('drawer', kineticScrollVel);
          }
          const dragDown = (baseDrawerScrollOffset + currentDragY) > 0 ? (baseDrawerScrollOffset + currentDragY) : currentDragY;

          // If pulled down past threshold (35px) or tapped on handle -> dismiss directly to clean Home Page!
          if (dragDown > 35 || (!hasDragged && activeTarget === 'drawer-top-handle' && Math.abs(currentDragY) < 15 && Math.abs(currentDragX) < 15)) {
            dismissDrawerToHome(true);
            isDragging = false;
            activeTarget = null;
            return;
          }

          // If pulled down only slightly, spring smoothly back up into open drawer
          railLeft.style.transition = 'transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)';
          railRight.style.transition = 'transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)';
          drawerTopHandle.style.transition = 'transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)';
          railLeft.style.transform = '';
          railRight.style.transform = '';
          drawerTopHandle.style.transform = '';
          homeCanvas.style.opacity = '';

          setTimeout(() => {
            railLeft.style.transition = '';
            railRight.style.transition = '';
            drawerTopHandle.style.transition = '';
          }, 220);

          // Snap drawer app scroll back within bounds
          const minScroll = -290;
          const maxScroll = 0;
          if (drawerScrollOffset > maxScroll) drawerScrollOffset = maxScroll;
          else if (drawerScrollOffset < minScroll) drawerScrollOffset = minScroll;
          baseDrawerScrollOffset = drawerScrollOffset;
          renderConveyor();

          isDragging = false;
          activeTarget = null;
          return;
        }

        // Arc Release: Free-wheel momentum coasting or downward dismissal
        if (activeTarget === 'arc-left') {
          if (!isRevolving) {
            const pushBackY = (e && peakDragY) ? (e.clientY - peakDragY) : currentDragY;
            if (currentDragY > 12 || pushBackY > 15) closeArcLeft();
          } else if (Math.abs(arcAngularVelocity) > 0.03) {
            startArcFreeWheel(true);
          }
          isRevolving = false;
        } else if (activeTarget === 'arc-right') {
          if (!isRevolving) {
            const pushBackY = (e && peakDragY) ? (e.clientY - peakDragY) : currentDragY;
            if (currentDragY > 12 || pushBackY > 15) closeArcRight();
          } else if (Math.abs(arcAngularVelocity) > 0.03) {
            startArcFreeWheel(false);
          }
          isRevolving = false;
        }

        // Tap on corner opens radial settings
        if (activeTarget === 'corner-left' && Math.abs(currentDragY) < 10 && Math.abs(currentDragX) < 10) {
          toggleArcLeft();
        } else if (activeTarget === 'corner-right' && Math.abs(currentDragY) < 10 && Math.abs(currentDragX) < 10) {
          toggleArcRight();
        }

        isDragging = false;
        activeTarget = null;
        isRevolving = false;
      }

      // ====================================================
      // DRAWER CONTROLS (Rails Themselves Morph into Centered Grid)
      // ====================================================
      function openDrawer() {
        if (drawerOpen) return;
        drawerOpen = true;
        railsOpen = true;
        drawerScrollOffset = 0;
        baseDrawerScrollOffset = 0;

        // PRE-CACHE: Sort icons and update DOM glyphs/labels ONCE (not per-frame)
        const aToZ = getDrawerOrderedApps();
        conveyorIconElements.forEach((item, i) => {
          const app = aToZ[i] || item.app;
          item.app = app;
          const glyph = item.el.querySelector('.app-icon-glyph');
          const lbl = item.el.querySelector('.app-icon-label');
          if (glyph) glyph.innerHTML = SVG_ICONS[app.key] || SVG_ICONS.terminal;
          if (lbl) lbl.textContent = app.name;
        });

        railLeft.style.transform = '';
        railRight.style.transform = '';
        railLeft.style.transition = '';
        railRight.style.transition = '';
        drawerTopHandle.style.transform = '';
        drawerTopHandle.style.transition = '';
        railLeft.classList.remove('retracted');
        railRight.classList.remove('retracted');
        screen.classList.add('rails-active');
        screen.classList.add('drawer-mode');
        // Poco rebuild: measure drawer widths NOW (one layout read per open, correct on any viewport)
        measureConveyor();

        // Close other panels
        closeArcLeft();
        closeArcRight();
        closeNotifModal();
        homeCanvas.classList.add('dimmed');

        renderConveyor();
      }

      function restoreRailsOrder() {
        const freq = getRailsOrderedApps();
        for (let k = 0; k < conveyorIconElements.length; k++) {
          const app = freq[k] || conveyorIconElements[k].app;
          conveyorIconElements[k].app = app;
          const glyph = conveyorIconElements[k].el.querySelector('.app-icon-glyph');
          const lbl = conveyorIconElements[k].el.querySelector('.app-icon-label');
          if (glyph) glyph.innerHTML = SVG_ICONS[app.key] || SVG_ICONS.terminal;
          if (lbl) lbl.textContent = app.name;
          conveyorIconElements[k].el.classList.remove('dragging');
          conveyorIconElements[k].el.style.visibility = 'visible';
        }
        measureConveyor();
      }

      function closeDrawer() {
        if (!drawerOpen) return;
        drawerOpen = false;
        railsOpen = false;
        drawerScrollOffset = 0;
        baseDrawerScrollOffset = 0;
        restoreRailsOrder();
        screen.classList.remove('drawer-mode', 'rails-active');
        railLeft.classList.add('retracted');
        railRight.classList.add('retracted');
        const topHandle = document.getElementById('drawerTopHandle');
        if (topHandle) {
          topHandle.style.opacity = '';
          topHandle.style.pointerEvents = '';
        }
        railLeft.style.transform = '';
        railRight.style.transform = '';
        railLeft.style.transition = '';
        railRight.style.transition = '';
        drawerTopHandle.style.transform = '';
        drawerTopHandle.style.transition = '';

        homeCanvas.classList.remove('dimmed');
        renderConveyor();
      }

      function dismissDrawerToHome(animated = true) {
        if (!drawerOpen) return;

        const performSilentCleanup = () => {
          // Clear transitions and restore visible opacity
          railLeft.style.transition = '';
          railRight.style.transition = '';
          drawerTopHandle.style.transition = '';
          railLeft.style.opacity = '';
          railRight.style.opacity = '';
          railLeft.style.transform = '';
          railRight.style.transform = '';
          drawerTopHandle.style.transform = '';

          // Reset drawer states and return strictly to clean Home Screen (NOT rails)
          drawerOpen = false;
          railsOpen = false;
          drawerScrollOffset = 0;
          baseDrawerScrollOffset = 0;
          restoreRailsOrder();
          screen.classList.remove('drawer-mode');
          screen.classList.remove('rails-active');
          railLeft.classList.add('retracted');
          railRight.classList.add('retracted');

          const topHandle = document.getElementById('drawerTopHandle');
          if (topHandle) {
            topHandle.style.opacity = '';
            topHandle.style.pointerEvents = '';
          }
          homeCanvas.style.transition = '';
          homeCanvas.style.opacity = '';
          homeCanvas.classList.remove('dimmed');

          renderConveyor();
        };

        if (animated) {
          railLeft.style.transition = 'transform 0.26s cubic-bezier(0.16, 1, 0.3, 1)';
          railRight.style.transition = 'transform 0.26s cubic-bezier(0.16, 1, 0.3, 1)';
          drawerTopHandle.style.transition = 'transform 0.26s cubic-bezier(0.16, 1, 0.3, 1)';
          railLeft.style.transform = 'translate3d(0, 750px, 0)';
          railRight.style.transform = 'translate3d(0, 750px, 0)';
          drawerTopHandle.style.transform = 'translateX(-50%) translate3d(0, 750px, 0)';
          homeCanvas.style.transition = 'opacity 0.26s ease';
          homeCanvas.style.opacity = '1';
          triggerIsland('ButterOS', 'Home Page', SVG_ICONS.clock);

          setTimeout(performSilentCleanup, 260);
        } else {
          performSilentCleanup();
          triggerIsland('ButterOS', 'Home Page', SVG_ICONS.clock);
        }
      }

      function toggleDrawer() {
        if (drawerOpen) dismissDrawerToHome(true);
        else openDrawer();
      }

      const _bOD = document.getElementById('btnOpenDrawer'); if (_bOD) { _bOD.onclick = toggleDrawer; }

      // Mouse wheel support for scrolling inside App Drawer
      function handleDrawerWheel(e) {
        if (!drawerOpen) return;
        e.preventDefault();
        const minScroll = -290;
        const maxScroll = 0;
        drawerScrollOffset = Math.max(minScroll, Math.min(maxScroll, drawerScrollOffset - e.deltaY * 0.7));
        baseDrawerScrollOffset = drawerScrollOffset;
        renderConveyor();
      }
      railLeft.addEventListener('wheel', handleDrawerWheel, { passive: false });
      railRight.addEventListener('wheel', handleDrawerWheel, { passive: false });

      // ====================================================
      // RAILS CONTROLS (Retract & Pop Up - Zero Navigation Toasts)
      // ====================================================
      function openBothRails() {
        railsOpen = true;
        railLeft.classList.remove('retracted');
        railRight.classList.remove('retracted');
        railLeft.style.transition = '';
        railRight.style.transition = '';
        railLeft.style.transform = '';
        railRight.style.transform = '';
        screen.classList.add('rails-active');
        homeCanvas.classList.add('dimmed');
      }

      function closeBothRails() {
        railsOpen = false;
        railLeft.classList.add('retracted');
        railRight.classList.add('retracted');
        railLeft.style.transition = '';
        railRight.style.transition = '';
        screen.classList.remove('rails-active');
        screen.classList.remove('drawer-mode');
        homeCanvas.classList.remove('dimmed');
      }

      function toggleBothRails() {
        if (railsOpen) closeBothRails();
        else openBothRails();
      }

      const _bTR = document.getElementById('btnToggleRails'); if (_bTR) { _bTR.onclick = toggleBothRails; }
      // Guides: tap opens instantly, swipe continues into rail scroll (no preventDefault killing tap)
      function bindGuide(guideEl, railTarget) {
        if (!guideEl) return;
        guideEl.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          if (!railsOpen && !drawerOpen) {
            isDragging = true; hasDragged = false;
            activeTarget = railTarget === 'left' ? 'edge-left' : 'edge-right';
            startX = e.clientX; startY = e.clientY;
            currentDragX = 0; currentDragY = 0;
          }
        });
        guideEl.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!railsOpen && !drawerOpen) openBothRails();
        });
      }
      bindGuide(guideLeft, 'left');
      bindGuide(guideRight, 'right');
      // Failsafe: never leave gestures stuck (the "can't swipe anymore" bug)
      window.addEventListener('pointercancel', () => { isDragging = false; activeTarget = null; hasDragged = false; });
      setInterval(() => { if (isDragging && activeTarget && (Date.now() - (window.__bLastMove || 0) > 4000)) { isDragging = false; activeTarget = null; } }, 4000);
      window.addEventListener('pointermove', () => { window.__bLastMove = Date.now(); }, { passive: true, capture: true });

      // ====================================================

      // ====================================================
      // BORDERLESS 3D SPATIAL NOTIFICATION DECK CONTROLLER
      // (Vertical 3D Rolodex Flip Stack [Android Lollipop/Nougat Recents Style] + 2-Second Auto-Flip)
      // ====================================================
      const spatialNotifDeck = document.getElementById('spatialNotifDeck');
      const spatialDeckTrack = document.getElementById('spatialDeckTrack');
      const spatialDeckIndicators = document.getElementById('spatialDeckIndicators');
      let spatialActiveIndex = 0;
      let spatialDeckVisible = false;
      let spatialAutoSlideTimer = null;
      let spatialSlideStartTime = 0;
      let isDeckUserInteracting = false;
      let is3DCarouselDragging = false;
      let isGestureSwipeMode = false;
      let lastGestureDy = 0;
      const SPATIAL_SLIDE_DURATION = 2000; // Auto-flips every 2.0 seconds

      function startSpatialAutoSlide() {
        stopSpatialAutoSlide();
        if (!spatialDeckVisible || isDeckUserInteracting) return;
        const visibleCount = BUTTEROS_NOTIFS.filter(n => !n.blocked).length;
        if (visibleCount <= 1) return;

        spatialAutoSlideTimer = setTimeout(() => {
          if (!spatialDeckVisible || isDeckUserInteracting) return;
          advanceSpatialCard(1, true);
        }, SPATIAL_SLIDE_DURATION);
      }

      function stopSpatialAutoSlide() {
        if (spatialAutoSlideTimer) {
          clearTimeout(spatialAutoSlideTimer);
          spatialAutoSlideTimer = null;
        }
      }

      // Minimal pagination indicators:
      // If <= 3 notifications: show exact number of small dots
      // If > 3 notifications: show exactly 3 dots and one horizontal line
      function renderSpatialIndicators() {
        if (!spatialDeckIndicators) return;
        spatialDeckIndicators.innerHTML = '';

        const visibleNotifs = BUTTEROS_NOTIFS.filter(n => !n.blocked);
        const count = visibleNotifs.length;
        if (count === 0) return;

        if (count <= 3) {
          for (let i = 0; i < count; i++) {
            const btn = document.createElement('button');
            btn.className = 'spatial-indicator-item' + (i === spatialActiveIndex ? ' is-active' : '');
            btn.title = `Notification ${i + 1}`;
            btn.innerHTML = '<span class="spatial-indicator-dot"></span>';
            const targetIdx = i;
            btn.onclick = (e) => {
              e.stopPropagation();
              jumpToSpatialCard(targetIdx);
            };
            spatialDeckIndicators.appendChild(btn);
          }
        } else {
          // Exactly 3 dots
          for (let i = 0; i < 3; i++) {
            const btn = document.createElement('button');
            btn.className = 'spatial-indicator-item' + (i === spatialActiveIndex ? ' is-active' : '');
            btn.title = `Notification ${i + 1}`;
            btn.innerHTML = '<span class="spatial-indicator-dot"></span>';
            const targetIdx = i;
            btn.onclick = (e) => {
              e.stopPropagation();
              jumpToSpatialCard(targetIdx);
            };
            spatialDeckIndicators.appendChild(btn);
          }

          // And one horizontal line for overflow (4th, 5th, etc.)
          const lineBtn = document.createElement('button');
          lineBtn.className = 'spatial-indicator-item' + (spatialActiveIndex >= 3 ? ' is-active' : '');
          lineBtn.title = 'More notifications';
          lineBtn.innerHTML = '<span class="spatial-indicator-line"></span>';
          lineBtn.onclick = (e) => {
            e.stopPropagation();
            if (spatialActiveIndex < 3) {
              jumpToSpatialCard(3);
            } else {
              const nextIdx = (spatialActiveIndex + 1) % count;
              jumpToSpatialCard(nextIdx < 3 ? 3 : nextIdx);
            }
          };
          spatialDeckIndicators.appendChild(lineBtn);
        }
      }

      function updateActiveIndicator() {
        if (!spatialDeckIndicators) return;
        const visibleNotifs = BUTTEROS_NOTIFS.filter(n => !n.blocked);
        const count = visibleNotifs.length;
        if (count === 0) {
          spatialDeckIndicators.innerHTML = '';
          return;
        }

        const items = spatialDeckIndicators.querySelectorAll('.spatial-indicator-item');
        if (count <= 3) {
          items.forEach((item, i) => {
            item.classList.toggle('is-active', i === spatialActiveIndex);
          });
        } else {
          items.forEach((item, i) => {
            if (i < 3) {
              item.classList.toggle('is-active', i === spatialActiveIndex);
            } else {
              item.classList.toggle('is-active', spatialActiveIndex >= 3);
            }
          });
        }
      }

      function jumpToSpatialCard(targetIdx) {
        const visibleCount = BUTTEROS_NOTIFS.filter(n => !n.blocked).length;
        if (visibleCount <= 1 || targetIdx === spatialActiveIndex) return;
        spatialActiveIndex = targetIdx;
        animateToActiveCard(0.48);
        updateActiveIndicator();
        startSpatialAutoSlide();
      }

      // Vertical 3D Rolodex Flip Stack Kinematics (Classic Android Lollipop/Nougat Recents)
      function updateCardTransformsRolodex(dragOffsetY = 0, isAnimated = false, durationSec = 0.48) {
        if (!spatialDeckTrack) return;
        const cards = spatialDeckTrack.querySelectorAll('.spatial-card');
        const N = cards.length;
        if (N === 0) return;

        // Swiping UP (dragOffsetY < 0) advances forward to next card
        // Swiping DOWN (dragOffsetY > 0) retreats to previous card
        const virtualPos = spatialActiveIndex - (dragOffsetY / 135);

        cards.forEach((card, idx) => {
          if (isAnimated) {
            card.style.transition = `transform ${durationSec}s cubic-bezier(0.16, 1, 0.3, 1), opacity ${durationSec}s cubic-bezier(0.16, 1, 0.3, 1)`;
          } else {
            card.style.transition = 'none';
          }

          let rel = idx - virtualPos;
          if (N > 1) {
            while (rel > N / 2) rel -= N;
            while (rel < -N / 2) rel += N;
          }

          let ty, tz, rotX, scale, opacity, zIndex;

          if (rel >= 0) {
            // Active front card and cards stacked behind in 3D perspective
            ty = -rel * 26; // Cascading upward into top view
            tz = -Math.min(220, rel * 62); // Receding along Z-axis
            rotX = Math.min(32, rel * 15); // Tilting backward
            scale = Math.max(0.82, 1 - rel * 0.055);
            opacity = Math.max(0, 1 - rel * 0.36);
            zIndex = Math.round(20 - rel * 2);
          } else {
            // Exiting card peeling forward/downward
            ty = rel * 88; // Dropping downward
            tz = Math.min(100, Math.abs(rel) * 45); // Moving forward towards viewer
            rotX = -rel * 32; // Tilting forward as it peels off
            scale = Math.max(0.85, 1 - Math.abs(rel) * 0.08);
            opacity = Math.max(0, 1 - Math.abs(rel) * 1.35);
            zIndex = Math.round(20 - Math.abs(rel) * 2);
          }

          card.style.transform = `translate3d(0, ${ty.toFixed(1)}px, ${tz.toFixed(1)}px) rotateX(${rotX.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
          card.style.opacity = opacity.toFixed(2);
          card.style.zIndex = zIndex;
          card.style.pointerEvents = Math.abs(rel) < 0.35 ? 'auto' : 'none';
        });
      }

      function animateToActiveCard(durationSec = 0.48) {
        updateCardTransformsRolodex(0, true, durationSec);
      }

      function advanceSpatialCard(dir = 1, asRolodex = true) {
        const visibleCount = BUTTEROS_NOTIFS.filter(n => !n.blocked).length;
        if (visibleCount <= 1) return;

        spatialActiveIndex = (spatialActiveIndex + dir + visibleCount) % visibleCount;
        updateActiveIndicator();
        animateToActiveCard(0.48);
        startSpatialAutoSlide();
      }

      function renderSpatialDeck() {
        if (!spatialDeckTrack) return;
        spatialDeckTrack.innerHTML = '';

        const visibleNotifs = BUTTEROS_NOTIFS.filter(n => !n.blocked);
        if (visibleNotifs.length === 0) {
          stopSpatialAutoSlide();
          if (spatialDeckIndicators) spatialDeckIndicators.innerHTML = '';
          spatialDeckTrack.innerHTML = `
            <div class="spatial-card" style="text-align: center; justify-content: center; align-items: center; padding: 20px;">
              <div style="font-size: 12px; font-weight: 700; color: var(--accent);">✓ All Caught Up</div>
              <div style="font-size: 10px; color: var(--text-dim); margin-top: 4px;">Zero unread notifications</div>
            </div>
          `;
          return;
        }

        if (spatialActiveIndex >= visibleNotifs.length) {
          spatialActiveIndex = Math.max(0, visibleNotifs.length - 1);
        }

        visibleNotifs.forEach((notif, idx) => {
          const card = document.createElement('div');
          card.className = 'spatial-card' + (idx === spatialActiveIndex ? ' is-active' : '');

          let iconSvg = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>';
          if (notif.app === 'Terminal') {
            iconSvg = '<svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>';
          } else if (notif.app === 'Messages') {
            iconSvg = '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
          } else if (notif.app === 'System') {
            iconSvg = '<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/></svg>';
          } else if (notif.app === 'Git') {
            iconSvg = '<svg viewBox="0 0 24 24"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" y1="9" x2="6" y2="21"/></svg>';
          }

          card.innerHTML = `
            <div class="spatial-card-header">
              <div class="spatial-card-app">
                <span class="spatial-card-app-icon">${iconSvg}</span>
                <span class="spatial-card-app-name">${notif.app}</span>
              </div>
              <div class="spatial-card-meta">
                <span class="spatial-card-time">${notif.time}</span>
                <button class="spatial-card-dismiss-btn btn-dsm" title="Dismiss">✕</button>
              </div>
            </div>
            <div class="spatial-card-content">
              <div class="spatial-card-title">${notif.title}</div>
              <div class="spatial-card-body">${notif.body}</div>
            </div>
            <div class="spatial-card-footer">
              <div class="spatial-card-actions">
                <button class="spatial-card-chip btn-act">${notif.actionLabel}</button>
              </div>
            </div>
          `;

          // Card click
          card.onclick = (e) => {
            e.stopPropagation();
            if (isGestureSwipeMode || Math.abs(lastGestureDy) > 8) return;
            if (idx !== spatialActiveIndex) {
              jumpToSpatialCard(idx);
            } else {
              triggerIsland(notif.app, notif.title, iconSvg);
            }
          };

          // Action button
          const actBtn = card.querySelector('.btn-act');
          if (actBtn) {
            actBtn.onclick = (e) => {
              e.stopPropagation();
              triggerIsland(notif.app, `${notif.actionLabel}ing...`, iconSvg);
              setTimeout(() => {
                notif.blocked = true;
                renderSpatialDeck();
                renderNotifications();
                startSpatialAutoSlide();
              }, 400);
            };
          }

          // Dismiss button
          const dsmBtn = card.querySelector('.btn-dsm');
          if (dsmBtn) {
            dsmBtn.onclick = (e) => {
              e.stopPropagation();
              notif.blocked = true;
              renderSpatialDeck();
              renderNotifications();
              startSpatialAutoSlide();
              triggerIsland('Notification', `${notif.app} dismissed`);
            };
          }

          spatialDeckTrack.appendChild(card);
        });

        renderSpatialIndicators();
        animateToActiveCard(0);
      }

      function openSpatialNotifDeck(side) {
        if (!spatialNotifDeck) return;
        spatialDeckVisible = true;
        renderSpatialDeck();
        requestAnimationFrame(() => {
          spatialNotifDeck.classList.add('is-visible');
          startSpatialAutoSlide();
        });
      }

      function closeSpatialNotifDeck() {
        if (!spatialNotifDeck) return;
        spatialDeckVisible = false;
        stopSpatialAutoSlide();
        spatialNotifDeck.classList.remove('is-visible');
      }

      // Responsive Vertical 3D Rolodex Swiping (Pointer + Touch + Wheel)
      if (spatialNotifDeck) {
        let gestureStartX = 0;
        let gestureStartY = 0;
        
      // Tap-to-dismiss & 2-Stage Gesture (Home -> Rails with Haptic Detent -> Full App Drawer)
      let tapTrackStartX = 0;
      let tapTrackStartY = 0;
      let tapTrackStartTime = 0;
      let stagedGestureDetentHit = false;
      let stagedGestureDetentTime = 0;
      let isPointerActive = false;
        let activePointerId = null;
        let resumeAutoSlideTimer = null;

        function startGesture(clientX, clientY, pId = null) {
          if (resumeAutoSlideTimer) {
            clearTimeout(resumeAutoSlideTimer);
            resumeAutoSlideTimer = null;
          }
          isPointerActive = true;
          isGestureSwipeMode = false;
          gestureStartX = clientX;
          gestureStartY = clientY;
          lastGestureDy = 0;
          activePointerId = pId;
          isDeckUserInteracting = true;
          stopSpatialAutoSlide();
        }

        function moveGesture(clientX, clientY, e) {
          if (!isPointerActive || !spatialDeckVisible) return;
          const dx = clientX - gestureStartX;
          const dy = clientY - gestureStartY;

          if (!isGestureSwipeMode) {
            if (Math.abs(dy) > 5 && Math.abs(dy) > Math.abs(dx)) {
              isGestureSwipeMode = true;
              is3DCarouselDragging = true;
            } else if (Math.abs(dx) > 14) {
              isPointerActive = false;
              is3DCarouselDragging = false;
              return;
            }
          }

          if (isGestureSwipeMode) {
            if (e && e.cancelable) e.preventDefault();
            lastGestureDy = dy;
            updateCardTransformsRolodex(dy, false);
          }
        }

        function endGesture() {
          if (!isPointerActive) return;
          isPointerActive = false;

          const visibleCount = BUTTEROS_NOTIFS.filter(n => !n.blocked).length;
          if (isGestureSwipeMode && visibleCount > 1) {
            const threshold = 30;
            if (lastGestureDy < -threshold) {
              // Swiped UP -> flip forward to next card
              spatialActiveIndex = (spatialActiveIndex + 1) % visibleCount;
            } else if (lastGestureDy > threshold) {
              // Swiped DOWN -> flip backward to previous card
              spatialActiveIndex = (spatialActiveIndex - 1 + visibleCount) % visibleCount;
            }
            animateToActiveCard(0.48);
            updateActiveIndicator();
          } else {
            animateToActiveCard(0.32);
          }

          if (resumeAutoSlideTimer) clearTimeout(resumeAutoSlideTimer);
          resumeAutoSlideTimer = setTimeout(() => {
            isGestureSwipeMode = false;
            is3DCarouselDragging = false;
            isDeckUserInteracting = false;
            if (spatialDeckVisible) {
              startSpatialAutoSlide();
            }
          }, 1200);
        }

        function cancelGesture() {
          if (!isPointerActive) return;
          isPointerActive = false;
          isGestureSwipeMode = false;
          is3DCarouselDragging = false;
          animateToActiveCard(0.32);
          if (resumeAutoSlideTimer) clearTimeout(resumeAutoSlideTimer);
          resumeAutoSlideTimer = setTimeout(() => {
            isDeckUserInteracting = false;
            if (spatialDeckVisible) startSpatialAutoSlide();
          }, 800);
        }

        // Pointer Events (with setPointerCapture and stopPropagation)
        spatialNotifDeck.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          if (e.target.closest('.btn-act') || e.target.closest('.btn-dsm') || e.target.closest('.spatial-indicator-item')) {
            return;
          }
          try { spatialNotifDeck.setPointerCapture(e.pointerId); } catch(err) {}
          startGesture(e.clientX, e.clientY, e.pointerId);
        });

        spatialNotifDeck.addEventListener('pointermove', (e) => {
          e.stopPropagation();
          moveGesture(e.clientX, e.clientY, e);
        });

        spatialNotifDeck.addEventListener('pointerup', (e) => {
          e.stopPropagation();
          try { spatialNotifDeck.releasePointerCapture(e.pointerId); } catch(err) {}
          endGesture();
        });

        spatialNotifDeck.addEventListener('pointercancel', (e) => {
          e.stopPropagation();
          try { spatialNotifDeck.releasePointerCapture(e.pointerId); } catch(err) {}
          cancelGesture();
        });

        // Touch events fallback only for legacy browsers lacking PointerEvent
        if (!window.PointerEvent) {
          spatialNotifDeck.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            if (e.touches.length === 1) {
              const t = e.touches[0];
              startGesture(t.clientX, t.clientY);
            }
          }, { passive: true });

          spatialNotifDeck.addEventListener('touchmove', (e) => {
            e.stopPropagation();
            if (e.touches.length === 1) {
              const t = e.touches[0];
              moveGesture(t.clientX, t.clientY, e);
            }
          }, { passive: false });

          spatialNotifDeck.addEventListener('touchend', (e) => {
            e.stopPropagation();
            endGesture();
          }, { passive: true });

          spatialNotifDeck.addEventListener('touchcancel', (e) => {
            e.stopPropagation();
            cancelGesture();
          }, { passive: true });
        }

        // Wheel event
        spatialNotifDeck.addEventListener('wheel', (e) => {
          e.stopPropagation();
          const visibleCount = BUTTEROS_NOTIFS.filter(n => !n.blocked).length;
          if (visibleCount <= 1) return;
          isDeckUserInteracting = true;
          stopSpatialAutoSlide();
          if (e.deltaY > 10 || e.deltaX > 10) {
            advanceSpatialCard(1, true);
          } else if (e.deltaY < -10 || e.deltaX < -10) {
            advanceSpatialCard(-1, true);
          }
          setTimeout(() => {
            isDeckUserInteracting = false;
            if (spatialDeckVisible) {
              startSpatialAutoSlide();
            }
          }, 800);
        }, { passive: false });

        spatialNotifDeck.addEventListener('mouseenter', () => {
          isDeckUserInteracting = true;
          stopSpatialAutoSlide();
        });

        spatialNotifDeck.addEventListener('mouseleave', () => {
          if (!isPointerActive) {
            isDeckUserInteracting = false;
            if (spatialDeckVisible) {
              startSpatialAutoSlide();
            }
          }
        });
      }

      // QUARTER-CIRCLE ARCS
      // ====================================================
      function openArcLeft() {
        closeArcRight();
        arcOpenedTimestamp = Date.now();
        closeNotifModal();
        arcLeft.classList.add('open');
        homeCanvas.classList.add('dimmed');
        openSpatialNotifDeck('right');
      }

      function closeArcLeft(e) {
        if (e) e.stopPropagation();
        arcLeft.classList.remove('open');
        if (!arcRight.classList.contains('open')) {
          closeSpatialNotifDeck();
        }
        if (!arcRight.classList.contains('open') && !drawerOpen && !railsOpen) {
          homeCanvas.classList.remove('dimmed');
        }
      }

      function toggleArcLeft() {
        if (arcLeft.classList.contains('open')) closeArcLeft();
        else openArcLeft();
      }

      function openArcRight() {
        closeArcLeft();
        arcOpenedTimestamp = Date.now();
        closeNotifModal();
        arcRight.classList.add('open');
        homeCanvas.classList.add('dimmed');
        openSpatialNotifDeck('left');
      }

      function closeArcRight(e) {
        if (e) e.stopPropagation();
        arcRight.classList.remove('open');
        if (!arcLeft.classList.contains('open')) {
          closeSpatialNotifDeck();
        }
        if (!arcLeft.classList.contains('open') && !drawerOpen && !railsOpen) {
          homeCanvas.classList.remove('dimmed');
        }
      }

      function toggleArcRight() {
        if (arcRight.classList.contains('open')) closeArcRight();
        else openArcRight();
      }

      const _bOAL = document.getElementById('btnOpenArcLeft'); if (_bOAL) { _bOAL.onclick = toggleArcLeft; }
      const _bOAR = document.getElementById('btnOpenArcRight'); if (_bOAR) { _bOAR.onclick = toggleArcRight; }

      // Direct tap bindings for hardware notch horns and bottom corner indicators
      const statusHornRight = document.getElementById('statusHornRight');
      if (statusHornRight) {
        statusHornRight.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleArcRight();
        });
      }

      const statusHornLeft = document.getElementById('statusHornLeft');
      if (statusHornLeft) {
        statusHornLeft.addEventListener('click', (e) => {
          e.stopPropagation();
          if (notifModal.classList.contains('open')) closeNotifModal();
          else openNotifModal();
        });
      }

      if (cornerIndicatorLeft) {
        cornerIndicatorLeft.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleArcLeft();
        });
      }

      if (cornerIndicatorRight) {
        cornerIndicatorRight.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleArcRight();
        });
      }

      // Close panels on background tap or return to home page
      screen.addEventListener('click', (e) => {
        // Prevent accidental dismiss immediately after gesture opens arc or notification center
        if (Date.now() - arcOpenedTimestamp < 650) return;
        if (Date.now() - notifOpenedTimestamp < 650) return;

        // Dismiss notification center or quick settings if open over an app
        if (notifModal.classList.contains('open') && !notifModal.contains(e.target) && e.target.id !== 'btnOpenNotifs') {
          closeNotifModal();
          return;
        }
        if (arcLeft.classList.contains('open') && !arcLeft.contains(e.target) && !cornerIndicatorLeft.contains(e.target) && e.target.id !== 'btnOpenArcLeft') {
          closeArcLeft();
          return;
        }
        if (arcRight.classList.contains('open') && !arcRight.contains(e.target) && !cornerIndicatorRight.contains(e.target) && e.target.id !== 'btnOpenArcRight') {
          closeArcRight();
          return;
        }

        if (document.getElementById('butterAppModal')?.classList.contains('open')) return;

        // If a drag/swipe gesture just finished, do not treat as click
        if (hasDragged) {
          hasDragged = false;
          return;
        }

        if (e.target.closest && (
          e.target.closest('.corner-round-notif-btn') || 
          e.target.closest('#btnOpenNotifs') ||
          e.target.closest('.quarter-circle-arc') ||
          e.target.closest('.corner-hover-indicator') ||
          e.target.closest('#spatialNotifDeck') ||
          e.target.closest('.spatial-notif-deck')
        )) {
          return;
        }

        if (notifModal.classList.contains('open') && !notifModal.contains(e.target) && e.target.id !== 'btnOpenNotifs') {
          closeNotifModal();
          return;
        }
        if (arcLeft.classList.contains('open') && !arcLeft.contains(e.target) && !cornerIndicatorLeft.contains(e.target) && e.target.id !== 'btnOpenArcLeft') {
          closeArcLeft();
          return;
        }
        if (arcRight.classList.contains('open') && !arcRight.contains(e.target) && !cornerIndicatorRight.contains(e.target) && e.target.id !== 'btnOpenArcRight') {
          closeArcRight();
          return;
        }
        if (drawerOpen) {
          if (!railLeft.contains(e.target) && !railRight.contains(e.target) && e.target.id !== 'btnOpenDrawer') {
            dismissDrawerToHome(true);
            return;
          }
        }

        // When in rails: clicking in the middle goes back to home page
        if (railsOpen && !drawerOpen) {
          const rect = screen.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const clickY = e.clientY - rect.top;

          // Middle area between left rail (0..76px) and right rail (width-76px..width)
          if (clickX >= 76 && clickX <= (rect.width - 76) && clickY > 24) {
            closeBothRails();
          }
        }
      });

      
      // ====================================================
      // MASTER ZERO-LATENCY TAP-TO-DISMISS ENGINE
      // Tapping any blank screen area cleanly dismisses all panels to home
      // ====================================================
      let masterTapDownTime = 0;
      let masterTapDownX = 0;
      let masterTapDownY = 0;

      window.addEventListener('pointerdown', (e) => {
        masterTapDownTime = Date.now();
        masterTapDownX = e.clientX;
        masterTapDownY = e.clientY;
      }, { capture: true, passive: true });

      window.addEventListener('pointerup', (e) => {
        if (document.getElementById('butterAppModal')?.classList.contains('open')) return;
        const tapDuration = Date.now() - masterTapDownTime;
        const tapDistance = Math.hypot(e.clientX - masterTapDownX, e.clientY - masterTapDownY);

        if (tapDuration < 320 && tapDistance < 14) {
          const isControl = e.target.closest && (
            e.target.closest('#butterAppModal') ||
            e.target.closest('.dock-app-slot') ||
            e.target.closest('.app-icon-slot') ||
            e.target.closest('.corner-round-notif-btn') ||
            e.target.closest('.btn-act') ||
            e.target.closest('.btn-dsm') ||
            e.target.closest('.spatial-indicator-item') ||
            e.target.closest('#homeBrowserTab') ||
            e.target.closest('button') ||
            e.target.closest('.polar-tile-block')
          );

          if (!isControl) {
            const anyPanelOpen = railsOpen || drawerOpen || 
              arcLeft.classList.contains('open') || 
              arcRight.classList.contains('open') || 
              notifModal.classList.contains('open');

            if (anyPanelOpen) {
              if (drawerOpen) dismissDrawerToHome(true);
              if (railsOpen) closeBothRails();
              closeArcLeft();
              closeArcRight();
              closeNotifModal();
              triggerHaptic(10)
              triggerIsland('ButterOS', 'Home Page', SVG_ICONS.clock);
            }
          }
        }
      }, { capture: true, passive: true });

      // Home Browser Tab Click -> Launch Chrome with Haptics
      document.getElementById('homeBrowserTab').onclick = (e) => {
        e.stopPropagation();
        const tab = document.getElementById('homeBrowserTab');
        tab.style.transform = 'scale(0.95)';
        setTimeout(() => { tab.style.transform = ''; }, 160);
        const chromeApp = MASTER_APP_CATALOG.find(a => a.key === 'browser') || { key: 'browser', name: 'Chrome', pkg: 'com.android.chrome' };
        executeNativeApp(chromeApp);
      };

            // Permanent Dock Icons: High-Reliability Native Touch & Click Handlers
      document.querySelectorAll('.dock-app-slot').forEach(slot => {
        let dockTouchDownX = 0, dockTouchDownY = 0, dockTouchTime = 0;
        let dockLastLaunch = 0;

        function launchDockSlot() {
          const now = Date.now();
          if (now - dockLastLaunch < 500) return;
          dockLastLaunch = now;
          slot.style.transform = 'scale(0.85)';
          setTimeout(() => { slot.style.transform = ''; }, 160);
          triggerHaptic(20);
          const appKey = slot.getAttribute('data-app') || 'terminal';
          const app = MASTER_APP_CATALOG.find(a => a.key === appKey) || { key: appKey, name: slot.getAttribute('title') || 'App' };
          executeNativeApp(app);
        }

        slot.addEventListener('touchstart', (ev) => {
          if (ev.touches && ev.touches[0]) {
            dockTouchDownX = ev.touches[0].clientX;
            dockTouchDownY = ev.touches[0].clientY;
          }
          dockTouchTime = Date.now();
          slot.style.transform = 'scale(0.88)';
        }, { passive: true });

        slot.addEventListener('touchend', (ev) => {
          const upX = (ev.changedTouches && ev.changedTouches[0]) ? ev.changedTouches[0].clientX : dockTouchDownX;
          const upY = (ev.changedTouches && ev.changedTouches[0]) ? ev.changedTouches[0].clientY : dockTouchDownY;
          const dist = Math.hypot(upX - dockTouchDownX, upY - dockTouchDownY);
          const dt = Date.now() - dockTouchTime;
          if (dist < 36 && dt < 700) {
            launchDockSlot();
          } else {
            slot.style.transform = '';
          }
        });

        slot.addEventListener('touchcancel', () => { slot.style.transform = ''; });

        slot.onclick = (e) => {
          e.stopPropagation();
          launchDockSlot();
        };
      });

      // Start strictly on clean Home Screen by default (user directive: don't start with rails on)
      railsOpen = false;
      drawerOpen = false;
      screen.classList.remove('rails-active', 'drawer-mode');
      railLeft.classList.add('retracted');
      railRight.classList.add('retracted');
      homeCanvas.classList.remove('dimmed');

      window.__butterBooted = true;
      try {
        const pillT = document.getElementById('hudPillText');
        if (pillT) pillT.textContent = 'ButterOS Active';
      } catch(_e) {}
      try { triggerIsland('ButterOS', 'Ready'); } catch(_e) {}

    })();
  </script>

  <script>
  // v4 boot watchdog: if main script crashed before finishing, say so on the pill
  window.addEventListener('load', function() {
    setTimeout(function() {
      if (!window.__butterBooted) {
        var msg = (window.__bootErrors && window.__bootErrors[0]) || 'main script crashed';
        var p = document.getElementById('hudPillText');
        if (p) p.textContent = 'BOOT FAIL: ' + msg;
      }
    }, 2500);
  });

        <button class="hud-btn" id="btnHudClear">Clear</button>
        <button class="hud-btn" id="btnHudClose">✕</button>
      </div>
    </div>
    <div class="hud-sequence-strip" id="hudSeqStrip">
      <span style="color:#777">Tap screen to inspect event sequence</span>

  <script>
  (function initEventHUD() {
    const pill = document.getElementById('butterosEventPill');
    const drawer = document.getElementById('butterosEventDrawer');
    const dot = document.getElementById('hudDot');
    const pillText = document.getElementById('hudPillText');
    const logsEl = document.getElementById('hudLogs');
    const seqStrip = document.getElementById('hudSeqStrip');
    const btnClear = document.getElementById('btnHudClear');
    const btnClose = document.getElementById('btnHudClose');

    let seq = [];

    pill.addEventListener('click', (e) => {
      e.stopPropagation();
      drawer.classList.toggle('open');
      // TEMP DIAG v5: tapping the top pill toggles RAILS directly (no swipe needed).
      // Proves whether rails can paint at all.
      try {
        const sc = document.getElementById('screen');
        const hc = document.getElementById('homeCanvas');
        if (sc && !sc.classList.contains('drawer-mode')) {
          sc.classList.toggle('rails-active');
          if (hc) hc.classList.toggle('dimmed', sc.classList.contains('rails-active'));
        }
      } catch(_e) {}
    });
    btnClose.addEventListener('click', (e) => { e.stopPropagation(); drawer.classList.remove('open'); });
    btnClear.addEventListener('click', (e) => { e.stopPropagation(); logsEl.innerHTML = ''; seqStrip.innerHTML = ''; seq = []; });

    // LITE MODE: per-event DOM logging (innerHTML + appendChild on every touch)
    // caused real-device jank — only update pill dot/text, skip log DOM entirely.
    const HUD_LITE = true;
    const EV_LIST = ['touchstart', 'touchend', 'pointerdown', 'pointerup', 'pointercancel', 'click'];
    EV_LIST.forEach(evType => {
      window.addEventListener(evType, (e) => {
        if (e.target && (e.target.closest('#butterosEventDrawer') || e.target.closest('#butterosEventPill'))) return;

        if (evType === 'pointerdown' || evType === 'touchstart') dot.className = 'hud-dot down';
        else if (evType === 'click') dot.className = 'hud-dot click';
        else if (evType === 'pointerup' || evType === 'touchend') dot.className = 'hud-dot';

        const pType = e.pointerType || (evType.startsWith('touch') ? 'touch' : 'mouse');
        pillText.textContent = `${evType} (${pType})`;
        if (HUD_LITE) return;

        // Sequence
        if (evType === 'pointerdown' || evType === 'touchstart') {
          if (seq.length > 5 || Date.now() - (seq.last || 0) > 1000) seq = [];
        }
        seq.last = Date.now();
        seq.push(evType);
        seqStrip.innerHTML = seq.map(s => `<span class="hud-seq-badge" style="background:#222;color:#deb056">${s}</span>`).join(' ➔ ');

        let cx = 0, cy = 0;
        if (e.touches && e.touches.length > 0) { cx = Math.round(e.touches[0].clientX); cy = Math.round(e.touches[0].clientY); }
        else if (e.clientX !== undefined) { cx = Math.round(e.clientX); cy = Math.round(e.clientY); }

        let tStr = e.target.tagName.toLowerCase();
        if (e.target.id) tStr += '#' + e.target.id;
        else if (e.target.className && typeof e.target.className === 'string') tStr += '.' + e.target.className.split(' ')[0];

        const row = document.createElement('div');
        row.className = `hud-entry ev-${evType}`;
        row.innerHTML = `
          <div><b style="color:#deb056">${evType}</b></div>
          <div>${pType}</div>
          <div style="color:#f8df9e">${cx},${cy}</div>
          <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${tStr}</div>
          <div>${e.defaultPrevented ? '<span style="color:#f44">PRV</span>' : '<span style="color:#4f4">OK</span>'}</div>
        `;
        logsEl.appendChild(row);
        if (logsEl.children.length > 30) logsEl.removeChild(logsEl.firstChild);
      }, { capture: true, passive: false });
    });
