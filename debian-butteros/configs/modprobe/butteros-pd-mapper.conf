# ADD-ON: load the in-kernel protection-domain mapper BEFORE the remoteproc helpers.
# If qcom_pd_mapper loads after the DSPs (adsp/cdsp/slpi/mpss) start, their firmware can
# crash/watchdog during early boot -> the ~12 s boot reset we saw. Same fix as the upstream
# MODULE_SOFTDEP("pre: qcom_pd_mapper") patch for qcom_common.
softdep qcom_common pre: qcom_pd_mapper
