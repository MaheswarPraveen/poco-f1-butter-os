# /etc/tmpfiles.d/butteros-cpufreq.conf
# Enforce schedutil governor and cap Snapdragon 845 Gold cores as root on early boot
w- /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor - - - - schedutil
w- /sys/devices/system/cpu/cpu1/cpufreq/scaling_governor - - - - schedutil
w- /sys/devices/system/cpu/cpu2/cpufreq/scaling_governor - - - - schedutil
w- /sys/devices/system/cpu/cpu3/cpufreq/scaling_governor - - - - schedutil
w- /sys/devices/system/cpu/cpu4/cpufreq/scaling_governor - - - - schedutil
w- /sys/devices/system/cpu/cpu5/cpufreq/scaling_governor - - - - schedutil
w- /sys/devices/system/cpu/cpu6/cpufreq/scaling_governor - - - - schedutil
w- /sys/devices/system/cpu/cpu7/cpufreq/scaling_governor - - - - schedutil
w- /sys/devices/system/cpu/cpu4/cpufreq/scaling_max_freq - - - - 2208000
w- /sys/devices/system/cpu/cpu5/cpufreq/scaling_max_freq - - - - 2208000
w- /sys/devices/system/cpu/cpu6/cpufreq/scaling_max_freq - - - - 2208000
w- /sys/devices/system/cpu/cpu7/cpufreq/scaling_max_freq - - - - 2208000
