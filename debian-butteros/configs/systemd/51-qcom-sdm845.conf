# WirePlumber Audio Tuning for Qualcomm SDM845 (Xiaomi Poco F1)
# Locks native 48kHz clocking and prevents DSP dropouts / crackling

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      },
      {
        node.name = "~alsa_input.*"
      }
    ]
    actions = {
      update-props = {
        audio.rate = 48000
        audio.format = "S16LE"
        api.alsa.period-size = 4096
        api.alsa.period-num = 6
        api.alsa.headroom = 512
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
