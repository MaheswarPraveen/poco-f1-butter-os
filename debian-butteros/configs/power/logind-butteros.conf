# ADD-ON: phone-style power key. Debian's default HandlePowerKey=poweroff shut the phone
# down whenever the user pressed power to turn the screen off ("it gets stuck, nothing works").
# Short press is handled by butteros-powerkey (screen off/on); long press still powers off.
# Installed as /etc/systemd/logind.conf.d/50-butteros.conf
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
